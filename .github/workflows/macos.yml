name: Lihat Google di macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instal browser
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install chromium

      - name: Buka Google dan ambil screenshot
        run: |
          npx playwright screenshot \
            --browser chromium \
            --viewport-size "1366,768" \
            --wait-for-timeout 5000 \
            https://www.google.com \
            google.png

      - name: Simpan screenshot
        uses: actions/upload-artifact@v4
        with:
          name: tampilan-google
          path: google.png
          retention-days: 1
